spring:
  application:
    name: orders-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultzone: http://localhost:8761/eureka
  instance:
    instance_id: ${spring.application.name}:${spring.eureka.instance_id:${random.value}}
    prefer-ip-address: true