spring:
  application:
    name: payments-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultzone: http://localhost:8761/eureka
  instance:
    instance_id: ${spring.application.name}:${spring.eureka.instance_id:${random.value}}
    prefer-ip-address: true